name: ci

on:
  pull_request:
  push:
    branches-ignore: []

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate store against the rule
        run: node engine/validate.mjs
      - run: npm run lint
      - run: npm run build
